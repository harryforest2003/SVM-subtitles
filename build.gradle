plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'henkelmax'
		url = 'https://maven.maxhenkel.de/repository/public'
		content { includeGroup 'de.maxhenkel.voicechat' }
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
}

// Dev-only helpers (never part of the released jar): see src/devtools.
sourceSets {
	devtools {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

loom {
	mods {
		"svm_subtitles" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"svm_subtitles_dev" {
			sourceSet sourceSets.devtools
		}
	}

	runs {
		// ./gradlew runSelfTest opens a singleplayer world, speaks the sample sentence through Simple Voice
		// Chat's real Opus pipeline in server mode and then client mode, logs what arrives in chat, and quits.
		selfTest {
			client()
			name = "Self Test"
			source sourceSets.devtools
			runDir = "run/selftest"
			vmArg "-Dsvmdev.selftest=true"
			programArgs "--width", "854", "--height", "480"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Simple Voice Chat: compile against the API, run the real mod in dev.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	devtoolsCompileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	localRuntime "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

	// Optional: settings screen in Mod Menu, built with Cloth Config. Neither is required at runtime.
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"

	// whisper.cpp bindings (ships natives for Windows/Linux/macOS), bundled inside our jar.
	implementation "io.github.givimad:whisper-jni:${project.whisper_jni_version}"
	include "io.github.givimad:whisper-jni:${project.whisper_jni_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
